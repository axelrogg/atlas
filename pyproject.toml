[project]
name = "atlas"
version = "0.1.0"
description = ""
authors = [
    {name = "Axel Rodríguez Chang",email = "axelrogg@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
]

[tool.poetry]
packages = [{include = "atlas", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "commitizen (>=4.19.3,<5.0.0) ; python_version >= \"3.14\" and python_version < \"4.0\""
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true
gpg_sign = true
