default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: poetry run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commitizen
        name: commit message format
        entry: poetry run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
